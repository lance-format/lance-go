# Native Windows evidence for the lance-c DLL.
#
# Each matrix entry builds the pinned upstream source with the host-native MSVC
# toolchain, then verifies the PE identity, header/export agreement, staged
# dependencies, a native C consumer, and the Go external-library tests. The same
# script and checks run on both architectures; -Architecture only selects the
# target triple and expected host/target metadata.
#
# amd64 runs on windows-2022 with x86_64-pc-windows-msvc.
# arm64 runs on the GitHub-hosted windows-11-vs2026-arm image with
# aarch64-pc-windows-msvc. That image provides a native ARM64 Visual Studio
# developer shell; the script asserts the host/target architecture and compiler
# PE machine instead of trusting the shell name. The pinned protoc win64 build
# tool may run under OS emulation on arm64; it is not linked into the DLL.
#
# This is evidence only: it does not publish a release, tag, or Go module. After
# the native gates pass, the script evaluates whether the actual DLL dependency
# closure is OS-only. An eligible closure produces an unpublished companion
# candidate at artifacts/windows-<arch>, verified by the shared artifact
# verifier and exercised by the external-tag roundtrip against the exact staged
# DLL. A redistributable or unclassified dependency blocks that candidate
# explicitly after native evidence; hosted System32 presence is not treated as
# OS-only availability. No push trigger is added, so pushing a topic branch does
# not start a build before review.
name: Windows native

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-native.yml"
      - "scripts/windows-native-build.ps1"
      - "scripts/windows-native/**"
      - "scripts/check-abi-symbols.go"
      - "scripts/sync-lance-c-gen/**"
      - "scripts/internal/artifactgen/**"
      - "scripts/verify-lance-c-artifact/**"
      - "examples/roundtrip/**"
      - "internal/ffi/**"
      - "internal/loader/**"
      - "internal/cdata/**"
      - "namespace*.go"
      - "namespace/**"
      - "dataset*.go"
      - "file/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
  PROTOC_VERSION: "21.12"
  PROTOC_SHA256: "71852a30cf62975358edfcbbff93086e8857a079c8e4d6904881aa968d65c7f9"

jobs:
  windows-native:
    name: windows-native-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-vs2026-arm
            rust_target: aarch64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Build and verify native Windows ${{ matrix.arch }}
        shell: pwsh
        timeout-minutes: 110
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/windows-native-build.ps1 -Architecture ${{ matrix.arch }}

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/windows-${{ matrix.arch }}
            dist/windows-${{ matrix.arch }}-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unpublished production candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-candidate-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lance-windows-native-${{ matrix.arch }}/candidate
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
          overwrite: true
