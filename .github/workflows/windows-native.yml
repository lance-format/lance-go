# Native Windows evidence for the published lance-c DLL.
#
# Each matrix entry acquires the pinned official lance-c release archive for its
# architecture with the shared acquisition tool, then verifies the PE identity,
# header/export agreement, staged dependencies, a native C consumer, and the
# full Go SDK suite. The suite runs the external tag at CGO 0, the default tag with the
# staged DLL supplied through LANCE_LIB_PATH, and on amd64 a CGO 1 -race lane
# with the host gcc; windows/arm64 has no supported Go race build, which is
# recorded as such rather than skipped. A missing or mismatched release asset
# fails the job; nothing builds lance-c from source.
#
# amd64 runs on windows-2022 and arm64 on the GitHub-hosted
# windows-11-vs2026-arm image. Both provide a native Visual Studio developer
# shell; the script asserts the host/target architecture and compiler PE
# machine instead of trusting the shell name.
#
# This is evidence only: it does not publish a release, tag, or Go module. After
# the native gates pass, the script evaluates whether the actual DLL dependency
# closure is OS-only. An eligible closure stages an unpublished artifact module
# candidate for windows/<arch>, verified by the shared artifact verifier and
# exercised by the external-tag roundtrip against the exact staged DLL. A redistributable or unclassified dependency blocks that candidate
# explicitly after native evidence; hosted System32 presence is not treated as
# OS-only availability. No push trigger is added, so pushing a topic branch
# does not start a build before review.
name: Windows native

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-native.yml"
      - "scripts/windows-native-verify.ps1"
      - "scripts/windows-native/**"
      - "internal/tools/check-abi-symbols/**"
      - "internal/tools/sync-lance-c-gen/**"
      - "internal/tools/artifactgen/**"
      - "internal/tools/verify-lance-c-artifact/**"
      - "examples/**"
      - "internal/**"
      - "internal/compat/**"
      - "internal/benchmarks/**"
      - "file/**"
      - "namespace/**"
      - "*.go"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  windows-native:
    name: windows-native-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-vs2026-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify published native Windows ${{ matrix.arch }}
        shell: pwsh
        timeout-minutes: 110
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File ./scripts/windows-native-verify.ps1 -Architecture ${{ matrix.arch }}

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/windows-${{ matrix.arch }}
            dist/windows-${{ matrix.arch }}-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unpublished production candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-candidate-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lance-windows-native-${{ matrix.arch }}/candidate
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
          overwrite: true
