name: Publish Go module origin

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the validated immutable candidate"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-go-module-origin
  cancel-in-progress: false

env:
  ORIGIN_VERSION: v0.3.1-preview.4
  ORIGIN_TIME: 2026-11-26T23:08:11Z
  ORIGIN_SOURCE_COMMIT: 33815aff61123c0ac2dff21ed47110215b5a855a
  ORIGIN_SOURCE_RELEASE: v0.2.1-beta.7
  ORIGIN_MANIFEST_SHA256: 2e76f4aff1a104d6bfdebf529c9cf66811c5216343e5ec3c3db15a1e73f5de7a
  UNIX_RUN_ID: "45909246624"
  WINDOWS_RUN_ID: "45909246673"
  # The Windows producer embeds the run attempt in each candidate artifact
  # name. Keep this paired with WINDOWS_RUN_ID when repinning.
  WINDOWS_ATTEMPT: "1"
  GOTOOLCHAIN: local
  GOWORK: "off"

jobs:
  stage:
    name: Stage and verify origin
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go 1.26
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Verify candidate runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in "$UNIX_RUN_ID" "$WINDOWS_RUN_ID"; do
            gh api "repos/${{ github.repository }}/actions/runs/$run" > "$RUNNER_TEMP/run-$run.json"
            jq -e --arg sha "$ORIGIN_SOURCE_COMMIT" \
              '.head_sha == $sha and .status == "completed" and .conclusion == "success"' \
              "$RUNNER_TEMP/run-$run.json" >/dev/null || {
                echo "candidate run $run is not a successful run of $ORIGIN_SOURCE_COMMIT" >&2
                exit 1
              }
          done

      - name: Download Unix candidate artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unix-native-candidate-linux-amd64
          path: ${{ runner.temp }}/downloads/unix-linux-amd64
          run-id: ${{ env.UNIX_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download Unix arm64 candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unix-native-candidate-linux-arm64
          path: ${{ runner.temp }}/downloads/unix-linux-arm64
          run-id: ${{ env.UNIX_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download Unix darwin candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unix-native-candidate-darwin-arm64
          path: ${{ runner.temp }}/downloads/unix-darwin-arm64
          run-id: ${{ env.UNIX_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download Windows amd64 candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-native-candidate-amd64-${{ env.WINDOWS_RUN_ID }}-${{ env.WINDOWS_ATTEMPT }}
          path: ${{ runner.temp }}/downloads/windows-amd64
          run-id: ${{ env.WINDOWS_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download Windows arm64 candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-native-candidate-arm64-${{ env.WINDOWS_RUN_ID }}-${{ env.WINDOWS_ATTEMPT }}
          path: ${{ runner.temp }}/downloads/windows-arm64
          run-id: ${{ env.WINDOWS_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Normalize candidate directory
        env:
          DOWNLOADS: ${{ runner.temp }}/downloads
          CANDIDATES: ${{ runner.temp }}/candidates
        run: |
          set -euo pipefail
          scripts/go-module-origin/stage-candidates.sh "$DOWNLOADS" "$CANDIDATES"

      - name: Verify candidate identity
        env:
          IDENTITY: scripts/go-module-origin/v0.3.1-preview.4.identity.json
          CANDIDATES: ${{ runner.temp }}/candidates
        run: |
          set -euo pipefail
          python3 scripts/go-module-origin/verify-candidate-identity.py "$IDENTITY" "$CANDIDATES"

      - name: Generate origin
        env:
          CANDIDATES_DIR: ${{ runner.temp }}/candidates
          OUT_DIR: ${{ runner.temp }}/origin
        run: |
          set -euo pipefail
          VERSION="$ORIGIN_VERSION" RELEASE_TIME="$ORIGIN_TIME" \
          SOURCE_COMMIT="$ORIGIN_SOURCE_COMMIT" SOURCE_RELEASE="$ORIGIN_SOURCE_RELEASE" \
          CANDIDATES_DIR="$CANDIDATES_DIR" OUT_DIR="$OUT_DIR" \
          scripts/build-go-module-origin.sh

      - name: Verify exact manifest and identity
        env:
          IDENTITY: scripts/go-module-origin/v0.3.1-preview.4.identity.json
          ORIGIN: ${{ runner.temp }}/origin
        run: |
          set -euo pipefail
          echo "$ORIGIN_MANIFEST_SHA256  $ORIGIN/manifest.json" | sha256sum -c -
          python3 - "$IDENTITY" "$ORIGIN/manifest.json" <<'PY'
          import json, pathlib, sys
          identity = json.load(open(sys.argv[1], encoding="utf-8"))
          manifest = json.load(open(sys.argv[2], encoding="utf-8"))
          assert manifest["version"] == identity["version"]
          assert manifest["time"] == identity["time"]
          assert manifest["source_commit"] == identity["source_commit"]
          assert len(manifest["objects"]) == 25
          zips = {o["target"]: o for o in manifest["objects"] if o["key"].endswith(".zip")}
          mods = {o["module"]: o for o in manifest["objects"] if o["key"].endswith(".mod")}
          for target, expected in identity["targets"].items():
              zip_obj = zips[target]
              assert zip_obj["zip_h1"] == expected["module_zip_h1"], target
              assert mods[zip_obj["module"]]["gomod_h1"] == expected["module_gomod_h1"], target
          print("manifest identity: ok")
          PY

      - name: Preflight publisher without credentials
        env:
          ORIGIN: ${{ runner.temp }}/origin
        run: |
          set -euo pipefail
          scripts/publish-go-module-origin.sh \
            --manifest "$ORIGIN/manifest.json" \
            --bucket dry-run \
            --endpoint https://example.invalid \
            --dry-run

      - name: Upload staging tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-module-origin-staging
          path: ${{ runner.temp }}/origin
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish immutable origin
    needs: stage
    if: github.ref == 'refs/heads/main' && inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: go-module-origin
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download staging tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-module-origin-staging
          path: ${{ runner.temp }}/origin
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify staged manifest before credentials
        env:
          ORIGIN: ${{ runner.temp }}/origin
        run: |
          set -euo pipefail
          echo "$ORIGIN_MANIFEST_SHA256  $ORIGIN/manifest.json" | sha256sum -c -
          scripts/publish-go-module-origin.sh \
            --manifest "$ORIGIN/manifest.json" \
            --bucket dry-run \
            --endpoint https://example.invalid \
            --dry-run

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_PAGER: ""
          AWS_EC2_METADATA_DISABLED: "true"
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          scripts/publish-go-module-origin.sh \
            --manifest "${{ runner.temp }}/origin/manifest.json" \
            --bucket "$R2_BUCKET" \
            --endpoint "$R2_S3_ENDPOINT" | tee "$RUNNER_TEMP/publication.log"

      - name: Upload publication log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-module-origin-publication
          path: ${{ runner.temp }}/publication.log
          retention-days: 7
          if-no-files-found: ignore
