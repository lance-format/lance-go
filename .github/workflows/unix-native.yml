# Native test matrix for the targets lance-c publishes for current releases.
# Intel macOS is retired; historical tags keep their evidence.
#
# Each job acquires the exact library and header from the official lance-c
# release archive pinned in internal/ffi/upstream.go, verifies the published
# per-asset checksum and the pinned header hash, tests the Go bindings against
# those published bytes, and stages a candidate companion module from the same
# unmodified library. It does not build lance-c from source and does not fall
# back to a source build; a missing or mismatched asset fails the job. The job
# does not publish or accept the candidate, activate a selector, or create a
# release. See artifacts/README.md for the publication gates that remain
# outside CI.
name: Unix native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - artifacts/**
      - scripts/check-native-library.sh
      - scripts/sync-lance-c.sh
      - internal/tools/check-abi-symbols/**
      - internal/tools/sync-lance-c-gen/**
      - internal/tools/artifactgen/**
      - internal/tools/verify-lance-c-artifact/**
      - internal/tools/fetch-lance-c-release/**
      - .github/workflows/unix-native.yml
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - artifacts/**
      - scripts/check-native-library.sh
      - scripts/sync-lance-c.sh
      - internal/tools/check-abi-symbols/**
      - internal/tools/sync-lance-c-gen/**
      - internal/tools/artifactgen/**
      - internal/tools/verify-lance-c-artifact/**
      - internal/tools/fetch-lance-c-release/**
      - .github/workflows/unix-native.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  native:
    name: Native ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            uname: x86_64
          - slug: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            uname: aarch64
          - slug: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            uname: arm64
    env:
      CGO_ENABLED: "0"
      TARGET: ${{ matrix.goos }}/${{ matrix.goarch }}
      TARGET_GOOS: ${{ matrix.goos }}
      TARGET_GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Record runner and target
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          {
            echo "target: $TARGET"
            echo "runner_os: $RUNNER_OS"
            echo "runner_arch: $RUNNER_ARCH"
            echo "runner_image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "uname: $(uname -srm)"
            echo "go_version: $(go version)"
            echo "repository: $GITHUB_REPOSITORY"
            echo "repository_commit: $GITHUB_SHA"
            echo "workflow_run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | tee "$RUNNER_TEMP/evidence/platform.txt"
          if [[ $RUNNER_OS == macOS ]]; then
            sw_vers | sed 's/^/sw_vers: /' | tee -a "$RUNNER_TEMP/evidence/platform.txt"
          else
            ldd --version | head -n 1 | sed 's/^/ldd: /' | tee -a "$RUNNER_TEMP/evidence/platform.txt"
          fi

      - name: Assert the runner matches the matrix target
        run: |
          set -euo pipefail
          actual_uname=$(uname -m)
          actual_goos=$(go env GOOS)
          actual_goarch=$(go env GOARCH)
          if [[ $actual_uname != "${{ matrix.uname }}" ]]; then
            echo "runner uname -m is $actual_uname, matrix expects ${{ matrix.uname }}" >&2
            exit 1
          fi
          if [[ $actual_goos != "$TARGET_GOOS" || $actual_goarch != "$TARGET_GOARCH" ]]; then
            echo "Go toolchain is $actual_goos/$actual_goarch, matrix expects $TARGET" >&2
            exit 1
          fi
          echo "native target $TARGET on $actual_uname"

      - name: Acquire pinned lance-c release
        id: native
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lance-c-release"
          go run ./internal/tools/fetch-lance-c-release \
            -target "$TARGET" \
            -out "$out" | tee "$RUNNER_TEMP/evidence/acquisition.txt"
          record="$out/acquisition.txt"
          library="$(sed -n 's/^library=//p' "$record")"
          header="$(sed -n 's/^header=//p' "$record")"
          library_sha="$(sed -n 's/^library_sha256=//p' "$record")"
          archive_sha="$(sed -n 's/^archive_sha256=//p' "$record")"
          if [[ -z $library || -z $header || -z $library_sha || -z $archive_sha ]]; then
            echo "acquisition record did not report the library, header, and hashes" >&2
            exit 1
          fi
          {
            echo "library=$library"
            echo "header=$header"
            echo "library_sha256=$library_sha"
            echo "archive_sha256=$archive_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Validate native library identity and dependencies
        env:
          LANCE_LIBRARY: ${{ steps.native.outputs.library }}
          LANCE_HEADER: ${{ steps.native.outputs.header }}
        run: |
          set -euo pipefail
          ./scripts/check-native-library.sh \
            --library "$LANCE_LIBRARY" \
            --header "$LANCE_HEADER" \
            --target "$TARGET" | tee "$RUNNER_TEMP/evidence/native-library.txt"

      - name: Check ABI against published header
        env:
          LANCE_C_HEADER: ${{ steps.native.outputs.header }}
        run: |
          set -euo pipefail
          go run ./internal/tools/check-abi-symbols 2>&1 | tee "$RUNNER_TEMP/evidence/abi-check.txt"

      - name: Test default build against installed library
        env:
          LANCE_LIB_PATH: ${{ steps.native.outputs.library }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/evidence/test-default.log"
          go test ./... -count=1 -v 2>&1 | tee "$log"
          for test in \
            TestLoadRealLibrary \
            TestLoadConcurrentSingleInstance \
            TestNativeErrorSemantics \
            TestOpenDatasetReportsNativeErrors \
            TestCreateReopenMetadataAndScan \
            TestWriteEmptyDatasetAndSlicedNullableBatch \
            TestExportStreamBorrowsReaderBatch; do
            if ! grep -Fq -- "--- PASS: $test " "$log"; then
              echo "required native test $test did not pass" >&2
              exit 1
            fi
          done
          if grep -Fq -- '--- SKIP:' "$log"; then
            grep -F -- '--- SKIP:' "$log" >&2
            echo "native tests skipped even though the library was supplied" >&2
            exit 1
          fi

      - name: Test external bundle against installed library
        env:
          LANCE_LIB_PATH: ${{ steps.native.outputs.library }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/evidence/test-external.log"
          go test -tags lance_external_lib ./... -count=1 -v 2>&1 | tee "$log"
          for test in \
            TestLoadRealLibrary \
            TestLoadConcurrentSingleInstance \
            TestNativeErrorSemantics \
            TestOpenDatasetReportsNativeErrors \
            TestCreateReopenMetadataAndScan \
            TestWriteEmptyDatasetAndSlicedNullableBatch \
            TestExportStreamBorrowsReaderBatch; do
            if ! grep -Fq -- "--- PASS: $test " "$log"; then
              echo "required native test $test did not pass with lance_external_lib" >&2
              exit 1
            fi
          done
          if grep -Fq -- '--- SKIP:' "$log"; then
            grep -F -- '--- SKIP:' "$log" >&2
            echo "external-tag native tests skipped even though the library was supplied" >&2
            exit 1
          fi

      - name: Test external bundle with race detector
        env:
          CGO_ENABLED: "1"
          LANCE_LIB_PATH: ${{ steps.native.outputs.library }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/evidence/test-race.log"
          go test -race -tags lance_external_lib ./... -count=1 -v 2>&1 | tee "$log"
          for test in \
            TestLoadRealLibrary \
            TestLoadConcurrentSingleInstance \
            TestNativeErrorSemantics \
            TestOpenDatasetReportsNativeErrors \
            TestCreateReopenMetadataAndScan \
            TestWriteEmptyDatasetAndSlicedNullableBatch \
            TestExportStreamBorrowsReaderBatch; do
            if ! grep -Fq -- "--- PASS: $test " "$log"; then
              echo "required native test $test did not pass under the race detector" >&2
              exit 1
            fi
          done
          if grep -Fq -- '--- SKIP:' "$log"; then
            grep -F -- '--- SKIP:' "$log" >&2
            echo "race native tests skipped even though the library was supplied" >&2
            exit 1
          fi

      - name: Select published production library
        env:
          LANCE_LIBRARY: ${{ steps.native.outputs.library }}
          LANCE_HEADER: ${{ steps.native.outputs.header }}
          LANCE_LIBRARY_SHA256: ${{ steps.native.outputs.library_sha256 }}
          LANCE_ARCHIVE_SHA256: ${{ steps.native.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          test -f "$LANCE_LIBRARY"
          test -f "$LANCE_HEADER"
          if command -v sha256sum >/dev/null 2>&1; then
            library_sha=$(sha256sum "$LANCE_LIBRARY" | awk '{print $1}')
            header_sha=$(sha256sum "$LANCE_HEADER" | awk '{print $1}')
          else
            library_sha=$(shasum -a 256 "$LANCE_LIBRARY" | awk '{print $1}')
            header_sha=$(shasum -a 256 "$LANCE_HEADER" | awk '{print $1}')
          fi
          if [[ $library_sha != "$LANCE_LIBRARY_SHA256" ]]; then
            echo "published library sha256 is $library_sha, acquisition record says $LANCE_LIBRARY_SHA256" >&2
            exit 1
          fi
          # The lance-c release workflow strips the published libraries, so the
          # verified archive bytes are the production packaging input unchanged.
          {
            echo "production_library: $LANCE_LIBRARY"
            echo "production_library_sha256: $library_sha"
            echo "production_library_bytes: $(wc -c < "$LANCE_LIBRARY" | tr -d ' ')"
            echo "header_sha256: $header_sha"
            echo "release_archive_sha256: $LANCE_ARCHIVE_SHA256"
            echo "strip_applied: false"
            echo "source: official lance-c release archive"
          } | tee "$RUNNER_TEMP/evidence/production-library.txt"

      - name: Round-trip the published production library
        env:
          CGO_ENABLED: "0"
          LANCE_LIB_PATH: ${{ steps.native.outputs.library }}
        run: |
          set -euo pipefail
          [[ -n ${LANCE_LIB_PATH:-} && -f $LANCE_LIB_PATH ]] || {
            echo "published LANCE_LIB_PATH is missing: ${LANCE_LIB_PATH:-unset}" >&2
            exit 1
          }
          log="$RUNNER_TEMP/evidence/published-roundtrip.log"
          go run -tags lance_external_lib ./examples/roundtrip 2>&1 | tee "$log"
          grep -Fqx 'Created, reopened and scanned 3 rows: [10 20 30]' "$log"

      - name: Stage production-path candidate companion module
        env:
          LANCE_LIBRARY: ${{ steps.native.outputs.library }}
          LANCE_HEADER: ${{ steps.native.outputs.header }}
          LANCE_ARCHIVE_SHA256: ${{ steps.native.outputs.archive_sha256 }}
          CANDIDATE_ROOT: ${{ runner.temp }}/candidate/${{ matrix.slug }}
          MODULE_PATH: github.com/lance-format/lance-go/artifacts/${{ matrix.slug }}
        run: |
          set -euo pipefail
          expected_module_path="github.com/lance-format/lance-go/artifacts/${TARGET//\//-}"
          [[ $MODULE_PATH == "$expected_module_path" ]] || {
            echo "candidate module path $MODULE_PATH does not match $expected_module_path" >&2
            exit 1
          }
          ./scripts/sync-lance-c.sh \
            --library "$LANCE_LIBRARY" \
            --header "$LANCE_HEADER" \
            --target "$TARGET" \
            --module-path "$MODULE_PATH" \
            --out "$CANDIDATE_ROOT"
          selector="$CANDIDATE_ROOT/selector/lance_bundle_${TARGET_GOOS}_${TARGET_GOARCH}.go"
          test -f "$selector"
          test -f "$CANDIDATE_ROOT/module/go.mod"
          test -f "$CANDIDATE_ROOT/module/artifact.go"
          grep -Fq "//go:build !lance_external_lib && $TARGET_GOOS && $TARGET_GOARCH" "$selector"
          grep -Fq "\"$MODULE_PATH\"" "$selector"
          go run ./internal/tools/verify-lance-c-artifact \
            -module "$CANDIDATE_ROOT/module" \
            -library "$LANCE_LIBRARY" \
            -target "$TARGET" \
            -module-path "$MODULE_PATH" | tee "$RUNNER_TEMP/evidence/artifact-verification.txt"
          library_sha=$(sed -n 's/^production_library_sha256: //p' "$RUNNER_TEMP/evidence/production-library.txt")
          [[ -n $library_sha ]] || {
            echo "published library hash is missing from production evidence" >&2
            exit 1
          }
          grep -Fqx "library_sha256=$library_sha" "$RUNNER_TEMP/evidence/artifact-verification.txt"
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain >&2
            echo "candidate staging changed the checkout; selectors must not be activated by this workflow" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            selector_sha=$(sha256sum "$selector" | awk '{print $1}')
          else
            selector_sha=$(shasum -a 256 "$selector" | awk '{print $1}')
          fi
          {
            echo "candidate_root: $CANDIDATE_ROOT"
            echo "module_path: $MODULE_PATH"
            echo "candidate_status: unpublished"
            echo "source: official lance-c release archive"
            echo "release_archive_sha256: $LANCE_ARCHIVE_SHA256"
            echo "library: $LANCE_LIBRARY"
            echo "library_sha256: $library_sha"
            echo "module_files:"
            find "$CANDIDATE_ROOT/module" -maxdepth 1 -type f -print | sort |
              while IFS= read -r file; do
                printf '  %s %s\n' "$(wc -c < "$file" | tr -d ' ')" "$(basename "$file")"
              done
            echo "selector: $(basename "$selector")"
            echo "selector_sha256: $selector_sha"
            echo "selector_activated: false"
          } | tee "$RUNNER_TEMP/evidence/candidate-staging.txt"

      - name: Upload production candidate companion module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unix-native-candidate-${{ matrix.slug }}
          path: ${{ runner.temp }}/candidate/${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unix-native-evidence-${{ matrix.slug }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
          overwrite: true
