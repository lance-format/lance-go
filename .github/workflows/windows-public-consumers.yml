# Public-consumer acceptance for the Windows static-CRT artifact.
#
# The lane resolves one exact release tag from the public Go module proxy,
# builds standalone default, namespace-only, and explicitly supplied DLL
# consumers outside the checkout, and inspects the actual loaded module.
# It does not build native code, publish modules, or activate a selector.
#
# This lane runs only when a root v* release tag is pushed, or by manual
# dispatch with that tag. It never accepts a commit SHA or pseudo-version:
# exact-head CI covers the checkout/local-source consumers instead. The root
# module and the matching go.lance.org/liblance/windows-<arch> module must
# already be published and adopted; a missing module fails the lane and is never
# skipped.
name: Windows public consumers

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact official release tag (for example v0.2.0) to resolve from proxy.golang.org"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local
  GOWORK: "off"
  GOENV: "off"
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org
  ARTIFACT_MODULE_PREFIX: go.lance.org/liblance

jobs:
  public-consumer:
    name: Public consumer ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: windows-amd64
            runner: windows-2022
            goarch: amd64
            processor_arch: AMD64
            os_name: Windows Server 2022
          - slug: windows-arm64
            runner: windows-11-vs2026-arm
            goarch: arm64
            processor_arch: ARM64
            os_name: Windows 11
    env:
      ROOT_MODULE: github.com/lance-format/lance-go
      TARGET_GOOS: windows
      TARGET_GOARCH: ${{ matrix.goarch }}
      TARGET_LABEL: ${{ matrix.slug }}
      LIBRARY_NAME: lance_c.dll
      EXPECTED_PROCESSOR_ARCH: ${{ matrix.processor_arch }}
      EXPECTED_OS_NAME: ${{ matrix.os_name }}
      ROOT_REVISION: ${{ github.event_name == 'push' && github.ref_name || inputs.revision }}
      SOURCE_COMMIT: ""
    steps:
      - name: Disable Git line-ending conversion
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.revision }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require an official release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ROOT_REVISION -notmatch '^v[0-9]') {
            throw "public consumers only run for an official release tag, got: $($env:ROOT_REVISION)"
          }
          if ($env:ROOT_REVISION -match '^[0-9a-f]{40}$') {
            throw "public consumers do not accept a commit SHA: $($env:ROOT_REVISION)"
          }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $refs = git ls-remote --tags origin "refs/tags/$($env:ROOT_REVISION)" "refs/tags/$($env:ROOT_REVISION)^{}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $commits = @($refs | ForEach-Object { ($_ -split "\s+")[0] })
          if ($commits -notcontains $head) {
            throw "checked-out HEAD $head is not the tag $($env:ROOT_REVISION)"
          }

      - name: Set up Go 1.23 from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run harness static checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command python3 -ErrorAction SilentlyContinue }
          if (-not $python) { throw 'python or python3 is required' }
          & $python.Source -B scripts/public-consumer/binary_metadata_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python.Source scripts/public-consumer/verify_test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ./scripts/public-consumer/windows-harness-test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test default-bundle RTree and raw Blob v2 on the public module
        shell: pwsh
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/public-consumer-evidence
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrEmpty($env:LANCE_LIB_PATH)) {
            throw 'LANCE_LIB_PATH must be unset so the default bundle is exercised'
          }
          $cgo = (& go env CGO_ENABLED).Trim()
          if ($cgo -ne '0') { throw "CGO_ENABLED must be 0, got $cgo" }
          $evidence = $env:EVIDENCE_DIR
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $artifact = 'go.lance.org/liblance/${{ matrix.slug }}'
          & go list -m -f 'artifact={{.Path}}@{{.Version}}' $artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = Join-Path $env:LOCALAPPDATA 'lance-go'
          if (Test-Path -LiteralPath $cache) {
            Remove-Item -LiteralPath $cache -Recurse -Force
          }
          $log = Join-Path $evidence 'default-bundle-regressions.log'
          & go test -tags lance_rtree_native -run '^(TestRTree|TestRawBlobV2)' -count=1 -p 1 -v . ./file 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
          $text = Get-Content -LiteralPath $log -Raw
          foreach ($pass in @(
            '--- PASS: TestRTreeScalarIndexGeometryQueriesAndLifecycle',
            '--- PASS: TestRawBlobV2ReleasedFixtureSchemaAndValues',
            '--- PASS: TestRawBlobV2StreamOutlivesReader'
          )) {
            if (-not $text.Contains($pass)) {
              throw "default-bundle regression did not pass: $pass"
            }
          }

      - name: Run Windows public-consumer acceptance
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/public-consumer-evidence
        shell: pwsh
        run: ./scripts/public-consumer/run-windows.ps1

      - name: Upload public-consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-public-consumer-${{ matrix.slug }}
          path: ${{ runner.temp }}/public-consumer-evidence/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
