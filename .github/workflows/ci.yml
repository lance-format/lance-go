name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.23.x
          - stable
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Check module consistency
        if: matrix.go-version == '1.23.x'
        run: |
          set -euo pipefail
          go mod tidy -diff
          go mod verify

      - name: Vet
        run: |
          set -euo pipefail
          go vet ./...
          go vet -tags lance_external_lib ./...

      - name: Build
        run: |
          set -euo pipefail
          go build ./...
          go build -tags lance_external_lib ./...

      - name: Test
        run: |
          set -euo pipefail
          go test ./... -count=1
          go test -tags lance_external_lib ./... -count=1

      - name: Test bundled linux/amd64 public path
        run: |
          set -euo pipefail
          cache_dir="$(mktemp -d)"
          log="$RUNNER_TEMP/bundled-public-path.log"
          env -u LANCE_LIB_PATH XDG_CACHE_HOME="$cache_dir" \
            go test . -count=1 -run '^TestCreateReopenMetadataAndScan$' -v 2>&1 | tee "$log"
          if ! grep -Fq -- '--- PASS: TestCreateReopenMetadataAndScan' "$log"; then
            echo "bundled public path test did not pass; it must not skip or use another library" >&2
            exit 1
          fi
          cache_file="$cache_dir/lance-go/4617c425e7e7660ef6d0d77f2e14dba48359400d78261b0072cd46e48e87e2ac/liblance_c.so"
          if [[ ! -f "$cache_file" ]]; then
            echo "bundled library was not extracted to $cache_file" >&2
            exit 1
          fi
          echo "4617c425e7e7660ef6d0d77f2e14dba48359400d78261b0072cd46e48e87e2ac  $cache_file" | sha256sum -c -

      - name: Verify README quickstart
        if: matrix.go-version == '1.23.x'
        env:
          RELEASE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          PULL_REQUEST_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          # A fork pull request's head commit is not resolvable as this module.
          if [[ -n "$PULL_REQUEST_HEAD_REPOSITORY" && "$PULL_REQUEST_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            unset RELEASE_REVISION
          fi
          if [[ -n "${RELEASE_REVISION:-}" ]]; then
            export LANCE_GO_QUICKSTART_VERSION="$RELEASE_REVISION"
          fi
          ./scripts/verify-quickstart.sh

  native:
    name: Native Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Acquire pinned lance-c release
        id: lance-c
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lance-c-release"
          go run ./internal/tools/fetch-lance-c-release \
            -target linux/amd64 \
            -out "$out" | tee "$RUNNER_TEMP/lance-c-acquisition.txt"
          record="$out/acquisition.txt"
          library="$(sed -n 's/^library=//p' "$record")"
          header="$(sed -n 's/^header=//p' "$record")"
          if [[ -z $library || -z $header ]]; then
            echo "acquisition record did not report the library and header" >&2
            exit 1
          fi
          echo "path=$library" >> "$GITHUB_OUTPUT"
          echo "header=$header" >> "$GITHUB_OUTPUT"

      - name: Check ABI against published header
        env:
          LANCE_C_HEADER: ${{ steps.lance-c.outputs.header }}
        run: |
          set -euo pipefail
          go run ./internal/tools/check-abi-symbols

      - name: Test against published library
        env:
          LANCE_LIB_PATH: ${{ steps.lance-c.outputs.path }}
        run: |
          set -euo pipefail
          go test ./... -count=1 -v 2>&1 | tee "$RUNNER_TEMP/native-tests.log"
          for test in \
            TestLoadRealLibrary \
            TestLoadConcurrentSingleInstance \
            TestNativeErrorSemantics \
            TestOpenDatasetReportsNativeErrors \
            TestCreateReopenMetadataAndScan \
            TestWriteEmptyDatasetAndSlicedNullableBatch \
            TestExportStreamBorrowsReaderBatch; do
            if ! grep -Fq -- "--- PASS: $test" "$RUNNER_TEMP/native-tests.log"; then
              echo "required native test $test did not pass; native tests must not be skipped" >&2
              exit 1
            fi
          done

      - name: Upload published library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lance-c-linux-x64
          path: ${{ steps.lance-c.outputs.path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence
          path: |
            ${{ runner.temp }}/lance-c-acquisition.txt
            ${{ runner.temp }}/native-tests.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  native-race:
    name: Native race (CGO 1)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download published library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lance-c-linux-x64
          path: ${{ runner.temp }}/lance-c-native

      - name: Locate downloaded library
        id: native-lib
        run: |
          set -euo pipefail
          library="$(find "$RUNNER_TEMP/lance-c-native" -type f -name 'liblance_c.so' -print -quit)"
          if [[ -z "$library" ]]; then
            echo "downloaded artifact does not contain liblance_c.so" >&2
            exit 1
          fi
          echo "path=$library" >> "$GITHUB_OUTPUT"

      - name: Test with race detector against published library
        env:
          LANCE_LIB_PATH: ${{ steps.native-lib.outputs.path }}
        run: |
          set -euo pipefail
          ldd "$LANCE_LIB_PATH" | tee "$RUNNER_TEMP/native-race-ldd.txt"
          if ldd "$LANCE_LIB_PATH" | grep -Fq 'not found'; then
            echo "published liblance_c has unresolved shared-library dependencies" >&2
            exit 1
          fi
          go test -race ./... -count=1 -v 2>&1 | tee "$RUNNER_TEMP/native-race-tests.log"
          for test in \
            TestLoadRealLibrary \
            TestLoadConcurrentSingleInstance \
            TestNativeErrorSemantics \
            TestOpenDatasetReportsNativeErrors \
            TestCreateReopenMetadataAndScan \
            TestWriteEmptyDatasetAndSlicedNullableBatch \
            TestExportStreamBorrowsReaderBatch; do
            if ! grep -Fq -- "--- PASS: $test" "$RUNNER_TEMP/native-race-tests.log"; then
              echo "required native test $test did not pass under the race detector" >&2
              exit 1
            fi
          done

      - name: Upload race evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-race-evidence
          path: |
            ${{ runner.temp }}/native-race-ldd.txt
            ${{ runner.temp }}/native-race-tests.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  cross:
    name: Cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build ./...
          go build -tags lance_external_lib ./...
