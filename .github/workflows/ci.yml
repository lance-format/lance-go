name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.26.x
          - stable
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: |
            go.sum
            internal/tools/go.sum

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Check module consistency
        if: matrix.go-version == '1.26.x'
        run: |
          set -euo pipefail
          go mod tidy -diff
          go mod verify
          go -C internal/tools mod tidy -diff
          go -C internal/tools mod verify

      - name: Vet
        run: |
          set -euo pipefail
          go vet ./...
          go vet -tags lance_external_lib ./...
          go -C internal/tools vet ./...

      - name: Build
        run: |
          set -euo pipefail
          go build ./...
          go build -tags lance_external_lib ./...
          go -C internal/tools build ./...

      - name: Test
        run: |
          set -euo pipefail
          go test ./... -count=1
          go test -tags lance_external_lib ./... -count=1
          go -C internal/tools test ./... -count=1

      - name: Test public-consumer harness
        run: |
          set -euo pipefail
          python3 -B scripts/public-consumer/verify_test.py -v

      - name: Test bundled linux/amd64 public path
        run: |
          set -euo pipefail
          cache_dir="$(mktemp -d)"
          log="$RUNNER_TEMP/bundled-public-path.log"
          env -u LANCE_LIB_PATH XDG_CACHE_HOME="$cache_dir" \
            go test . -count=1 -run '^TestCreateReopenMetadataAndScan$' -v 2>&1 | tee "$log"
          if ! grep -Fq -- '--- PASS: TestCreateReopenMetadataAndScan' "$log"; then
            echo "bundled public path test did not pass; it must not skip or use another library" >&2
            exit 1
          fi
          # Pinned from the verified linux-amd64 v0.3.1-preview.5 companion
          # (lance-c v0.2.1-beta.8).
          expected_sha256=554f0a13c81257987a4e839163b1e3e676d911e11006df3d7ff8341c0302d42f
          cache_file="$cache_dir/lance-go/$expected_sha256/liblance_c.so"
          if [[ ! -f "$cache_file" ]]; then
            echo "bundled library was not extracted to $cache_file" >&2
            exit 1
          fi
          echo "$expected_sha256  $cache_file" | sha256sum -c -

      - name: Verify local quickstart and read-only deployment
        if: matrix.go-version == '1.26.x'
        env:
          LANCE_GO_QUICKSTART_SOURCE_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ./scripts/verify-quickstart.sh

      - name: Test default-bundle RTree and raw Blob v2 from the checkout
        if: matrix.go-version == '1.26.x'
        run: |
          set -euo pipefail
          cache_dir="$(mktemp -d)"
          log="$RUNNER_TEMP/default-bundle-regressions.log"
          env -u LANCE_LIB_PATH XDG_CACHE_HOME="$cache_dir" CGO_ENABLED=0 \
            go test -tags lance_rtree_native -run '^(TestRTree|TestRawBlobV2)' -count=1 -p 1 -v . ./file 2>&1 | tee "$log"
          grep -Fq -- '--- PASS: TestRTreeScalarIndexGeometryQueriesAndLifecycle' "$log"
          grep -Fq -- '--- PASS: TestRawBlobV2ReleasedFixtureSchemaAndValues' "$log"
          grep -Fq -- '--- PASS: TestRawBlobV2StreamOutlivesReader' "$log"

  native:
    name: Native Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Acquire pinned lance-c release
        id: lance-c
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/lance-c-release"
          go -C internal/tools run ./fetch-lance-c-release \
            -target linux/amd64 \
            -out "$out" | tee "$RUNNER_TEMP/lance-c-acquisition.txt"
          record="$out/acquisition.txt"
          library="$(sed -n 's/^library=//p' "$record")"
          abi_header="$(./scripts/abi-checker-input.sh "$record")"
          if [[ -z $library || -z $abi_header ]]; then
            echo "acquisition record did not report the library and ABI header input" >&2
            exit 1
          fi
          echo "path=$library" >> "$GITHUB_OUTPUT"
          echo "abi_header=$abi_header" >> "$GITHUB_OUTPUT"

      - name: Check ABI against published header
        env:
          LANCE_C_HEADER: ${{ steps.lance-c.outputs.abi_header }}
        run: |
          set -euo pipefail
          go -C internal/tools run ./check-abi-symbols

      - name: Test against published library
        env:
          LANCE_LIB_PATH: ${{ steps.lance-c.outputs.path }}
        run: |
          set -euo pipefail
          go test ./... -count=1 -v 2>&1 | tee "$RUNNER_TEMP/native-tests.log"
          for test in \
            TestLoadRealLibrary \
            TestLoadConcurrentSingleInstance \
            TestNativeErrorSemantics \
            TestOpenDatasetReportsNativeErrors \
            TestCreateReopenMetadataAndScan \
            TestWriteEmptyDatasetAndSlicedNullableBatch \
            TestExportStreamBorrowsReaderBatch; do
            if ! grep -Fq -- "--- PASS: $test" "$RUNNER_TEMP/native-tests.log"; then
              echo "required native test $test did not pass; native tests must not be skipped" >&2
              exit 1
            fi
          done

      - name: Upload published library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lance-c-linux-x64
          path: ${{ steps.lance-c.outputs.path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence
          path: |
            ${{ runner.temp }}/lance-c-acquisition.txt
            ${{ runner.temp }}/native-tests.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  native-race:
    name: Native race (CGO 1)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download published library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lance-c-linux-x64
          path: ${{ runner.temp }}/lance-c-native

      - name: Locate downloaded library
        id: native-lib
        run: |
          set -euo pipefail
          library="$(find "$RUNNER_TEMP/lance-c-native" -type f -name 'liblance_c.so' -print -quit)"
          if [[ -z "$library" ]]; then
            echo "downloaded artifact does not contain liblance_c.so" >&2
            exit 1
          fi
          echo "path=$library" >> "$GITHUB_OUTPUT"

      - name: Test with race detector against published library
        env:
          LANCE_LIB_PATH: ${{ steps.native-lib.outputs.path }}
        run: |
          set -euo pipefail
          ldd "$LANCE_LIB_PATH" | tee "$RUNNER_TEMP/native-race-ldd.txt"
          if ldd "$LANCE_LIB_PATH" | grep -Fq 'not found'; then
            echo "published liblance_c has unresolved shared-library dependencies" >&2
            exit 1
          fi
          go test -race ./... -count=1 -v 2>&1 | tee "$RUNNER_TEMP/native-race-tests.log"
          for test in \
            TestLoadRealLibrary \
            TestLoadConcurrentSingleInstance \
            TestNativeErrorSemantics \
            TestOpenDatasetReportsNativeErrors \
            TestCreateReopenMetadataAndScan \
            TestWriteEmptyDatasetAndSlicedNullableBatch \
            TestExportStreamBorrowsReaderBatch; do
            if ! grep -Fq -- "--- PASS: $test" "$RUNNER_TEMP/native-race-tests.log"; then
              echo "required native test $test did not pass under the race detector" >&2
              exit 1
            fi
          done

      - name: Upload race evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-race-evidence
          path: |
            ${{ runner.temp }}/native-race-ldd.txt
            ${{ runner.temp }}/native-race-tests.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  cross:
    name: Cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build ./...
          go build -tags lance_external_lib ./...

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Install pinned linter
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/analysis-bin"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Lint the default and external-library builds
        run: |
          set -euo pipefail
          golangci-lint run
          golangci-lint run --build-tags lance_external_lib

      # The maintainer tools are a separate Go module. Run the same curated
      # configuration there so the gate covers both module scopes.
      - name: Lint the maintainer tools module
        run: |
          set -euo pipefail
          cd internal/tools
          golangci-lint run -c ../../.golangci.yml

  govulncheck:
    name: Vulnerability scan (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both maintained Go lines. The live vulnerability database is not
        # pinned, so the module versions are recorded in each log.
        go-version:
          - 1.26.x
          - stable
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Install pinned vulnerability scanner
        run: |
          set -euo pipefail
          export GOBIN="$RUNNER_TEMP/analysis-bin"
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          echo "$GOBIN" >> "$GITHUB_PATH"

      # The SDK module and the maintainer tools module are separate modules.
      # The tools module compresses and extracts release payloads through its
      # own compress dependency, so it needs its own scan.
      - name: Scan the SDK module
        run: |
          set -euo pipefail
          govulncheck -show=version ./...

      - name: Scan the maintainer tools module
        run: |
          set -euo pipefail
          cd internal/tools
          govulncheck -show=version ./...

  apidiff:
    name: API compatibility
    # Run on pull requests and manual dispatch. A minor-release line may carry
    # reviewed, intentional deltas from the previous stable tag; the report is
    # checked against its migration notes, and a push to main must not fail on
    # those approved deltas before the new tag exists.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The comparison needs the release tag and a worktree for it.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Compare exported APIs with the latest stable release
        run: ./scripts/check-api-compat.sh
