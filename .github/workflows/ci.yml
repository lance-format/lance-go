name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.23.x
          - stable
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Check module consistency
        if: matrix.go-version == '1.23.x'
        run: |
          set -euo pipefail
          go mod tidy -diff
          go mod verify

      - name: Vet
        run: |
          set -euo pipefail
          go vet ./...
          go vet -tags lance_external_lib ./...

      - name: Build
        run: |
          set -euo pipefail
          go build ./...
          go build -tags lance_external_lib ./...

      - name: Test
        run: |
          set -euo pipefail
          go test ./... -count=1
          go test -tags lance_external_lib ./... -count=1

      - name: Test bundled linux/amd64 public path
        run: |
          set -euo pipefail
          cache_dir="$(mktemp -d)"
          log="$RUNNER_TEMP/bundled-public-path.log"
          env -u LANCE_LIB_PATH XDG_CACHE_HOME="$cache_dir" \
            go test . -count=1 -run '^TestCreateReopenMetadataAndScan$' -v 2>&1 | tee "$log"
          if ! grep -Fq -- '--- PASS: TestCreateReopenMetadataAndScan' "$log"; then
            echo "bundled public path test did not pass; it must not skip or use another library" >&2
            exit 1
          fi
          cache_file="$cache_dir/lance-go/1de1e4bdb6a71a5bd7b14ddb3d18b5d79776abe30efebabc6f40e67b2ace7ba8/liblance_c.so"
          if [[ ! -f "$cache_file" ]]; then
            echo "bundled library was not extracted to $cache_file" >&2
            exit 1
          fi
          echo "1de1e4bdb6a71a5bd7b14ddb3d18b5d79776abe30efebabc6f40e67b2ace7ba8  $cache_file" | sha256sum -c -

  native:
    name: Native Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Rust stable
        id: rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master @ 2026-10-16
        with:
          toolchain: stable

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libprotobuf-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Record run provenance
        run: |
          set -euo pipefail
          facts="$RUNNER_TEMP/lance-c-build-provenance.txt"
          {
            echo "repository_commit: $GITHUB_SHA"
            echo "workflow_run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "runner: $(uname -srm)"
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "cmake: $(cmake --version | head -n 1)"
            echo "cc: $(cc --version | head -n 1)"
          } | tee "$facts"
          {
            echo "# current run"
            cat "$facts"
          } | tee "$RUNNER_TEMP/lance-c-provenance.txt"

      - name: Compute installed lance-c cache key
        id: lance-c-cache-key
        run: |
          set -euo pipefail
          # The prefix pins the cache schema and runner image family.
          rust_cachekey='${{ steps.rust.outputs.cachekey }}'
          if [[ -z $rust_cachekey ]]; then
            echo "Rust toolchain cache key is empty" >&2
            exit 1
          fi
          inputs_hash="$(sha256sum internal/ffi/upstream.go scripts/build-lance-c.sh scripts/lance-c-cache.sh | sha256sum | awk '{print $1}')"
          echo "key=lance-c-install-v1-ubuntu-24.04-$RUNNER_OS-$RUNNER_ARCH-rust-$rust_cachekey-$inputs_hash" >> "$GITHUB_OUTPUT"

      - name: Restore installed lance-c
        id: lance-c-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Exact key only: a different pin or toolchain build is never reused.
          path: ${{ runner.temp }}/lance-c-install-cache
          key: ${{ steps.lance-c-cache-key.outputs.key }}

      - name: Cache native source and Cargo downloads
        if: steps.lance-c-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/lance-c-build/src
            ~/.cargo/registry
            ~/.cargo/git
          key: lance-c-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('internal/ffi/upstream.go') }}
          restore-keys: |
            lance-c-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust.outputs.cachekey }}-

      - name: Verify native build prerequisites
        run: |
          set -euo pipefail
          rustc --version
          cmake --version | head -n 1
          awk -v version="$(rustc --version | awk '{print $2}')" 'BEGIN {
            split(version, v, ".")
            if (v[1] < 1 || (v[1] == 1 && v[2] < 94)) {
              printf "rustc %s is older than the required 1.94.0\n", version
              exit 1
            }
          }'
          awk -v version="$(cmake --version | awk 'NR == 1 {print $3}')" 'BEGIN {
            split(version, v, ".")
            if (v[1] < 3 || (v[1] == 3 && v[2] < 22)) {
              printf "cmake %s is older than the required 3.22\n", version
              exit 1
            }
          }'
          command -v protoc
          test -f /usr/include/google/protobuf/descriptor.proto
          test -f /usr/include/google/protobuf/timestamp.proto

      - name: Build pinned lance-c
        if: steps.lance-c-cache.outputs.cache-hit != 'true'
        env:
          LANCE_C_WORK_DIR: ${{ runner.temp }}/lance-c-build
        run: |
          set -euo pipefail
          ./scripts/build-lance-c.sh --out "$RUNNER_TEMP/lance-c-install"
          printf 'source_commit: %s\n' "$(git -C "$RUNNER_TEMP/lance-c-build/src" rev-parse HEAD)" |
            tee -a "$RUNNER_TEMP/lance-c-build-provenance.txt"

      - name: Validate installed library
        id: locate
        env:
          LANCE_C_CACHE_KEY: ${{ steps.lance-c-cache-key.outputs.key }}
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/lance-c-install-cache"
          cache_hit='${{ steps.lance-c-cache.outputs.cache-hit }}'
          paths="$RUNNER_TEMP/lance-c-cache-paths.txt"
          if [[ $cache_hit == true ]]; then
            cache_state=hit
            built_in_this_run=false
            ./scripts/lance-c-cache.sh verify \
              --cache "$cache" \
              --cache-key "$LANCE_C_CACHE_KEY" > "$paths"
          else
            cache_state=miss
            built_in_this_run=true
            ./scripts/lance-c-cache.sh write \
              --install "$RUNNER_TEMP/lance-c-install" \
              --cache "$cache" \
              --provenance "$RUNNER_TEMP/lance-c-build-provenance.txt" \
              --cache-key "$LANCE_C_CACHE_KEY" > "$paths"
          fi
          library="$(sed -n 's/^library=//p' "$paths")"
          header="$(sed -n 's/^header=//p' "$paths")"
          native_commit="$(sed -n 's/^commit=//p' "$paths")"
          if [[ -z $library || -z $header || -z $native_commit ]]; then
            echo "cache validation did not report the library, header, and commit" >&2
            exit 1
          fi
          echo "path=$library" >> "$GITHUB_OUTPUT"
          echo "header=$header" >> "$GITHUB_OUTPUT"
          {
            echo "# artifact resolution"
            echo "cache: $cache_state"
            echo "built_in_this_run: $built_in_this_run"
            echo "cache_key: $LANCE_C_CACHE_KEY"
            echo "lance_c_commit: $native_commit"
            echo "lance_c_library: $library"
            echo "lance_c_library_sha256: $(sha256sum "$library" | awk '{print $1}')"
            echo "lance_c_header_sha256: $(sha256sum "$header" | awk '{print $1}')"
            echo "manifest:"
            sed 's/^/  /' "$cache/manifest.txt"
            if [[ $built_in_this_run == true ]]; then
              echo "build_provenance:"
            else
              echo "original_build_provenance:"
            fi
            sed 's/^/  /' "$cache/build-provenance.txt"
          } >> "$RUNNER_TEMP/lance-c-provenance.txt"
          if [[ $built_in_this_run == true ]]; then
            echo "built lance-c in this run and validated the reusable cache entry"
          else
            echo "restored lance-c from the exact cache key; original build provenance follows"
          fi

      - name: Check ABI against installed header
        env:
          LANCE_C_HEADER: ${{ steps.locate.outputs.header }}
        run: |
          set -euo pipefail
          go run ./scripts/check-abi-symbols.go

      - name: Test against installed library
        env:
          LANCE_LIB_PATH: ${{ steps.locate.outputs.path }}
        run: |
          set -euo pipefail
          go test ./... -count=1 -v 2>&1 | tee "$RUNNER_TEMP/native-tests.log"
          for test in \
            TestLoadRealLibrary \
            TestLoadConcurrentSingleInstance \
            TestNativeErrorSemantics \
            TestOpenDatasetReportsNativeErrors \
            TestCreateReopenMetadataAndScan \
            TestWriteEmptyDatasetAndSlicedNullableBatch \
            TestExportStreamBorrowsReaderBatch; do
            if ! grep -Fq -- "--- PASS: $test" "$RUNNER_TEMP/native-tests.log"; then
              echo "required native test $test did not pass; native tests must not be skipped" >&2
              exit 1
            fi
          done

      - name: Upload installed library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lance-c-linux-x64
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-evidence
          path: |
            ${{ runner.temp }}/lance-c-provenance.txt
            ${{ runner.temp }}/native-tests.log
            ${{ runner.temp }}/lance-c-install-cache/manifest.txt
            ${{ runner.temp }}/lance-c-install-cache/build-provenance.txt
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  native-race:
    name: Native race (CGO 1)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download installed library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lance-c-linux-x64
          path: ${{ runner.temp }}/lance-c-native

      - name: Locate downloaded library
        id: native-lib
        run: |
          set -euo pipefail
          library="$(find "$RUNNER_TEMP/lance-c-native" -type f -name 'liblance_c.so' -print -quit)"
          if [[ -z "$library" ]]; then
            echo "downloaded artifact does not contain liblance_c.so" >&2
            exit 1
          fi
          echo "path=$library" >> "$GITHUB_OUTPUT"

      - name: Test with race detector against installed library
        env:
          LANCE_LIB_PATH: ${{ steps.native-lib.outputs.path }}
        run: |
          set -euo pipefail
          ldd "$LANCE_LIB_PATH" | tee "$RUNNER_TEMP/native-race-ldd.txt"
          if ldd "$LANCE_LIB_PATH" | grep -Fq 'not found'; then
            echo "installed liblance_c has unresolved shared-library dependencies" >&2
            exit 1
          fi
          go test -race ./... -count=1 -v 2>&1 | tee "$RUNNER_TEMP/native-race-tests.log"
          for test in \
            TestLoadRealLibrary \
            TestLoadConcurrentSingleInstance \
            TestNativeErrorSemantics \
            TestOpenDatasetReportsNativeErrors \
            TestCreateReopenMetadataAndScan \
            TestWriteEmptyDatasetAndSlicedNullableBatch \
            TestExportStreamBorrowsReaderBatch; do
            if ! grep -Fq -- "--- PASS: $test" "$RUNNER_TEMP/native-race-tests.log"; then
              echo "required native test $test did not pass under the race detector" >&2
              exit 1
            fi
          done

      - name: Upload race evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-race-evidence
          path: |
            ${{ runner.temp }}/native-race-ldd.txt
            ${{ runner.temp }}/native-race-tests.log
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  cross:
    name: Cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build ./...
          go build -tags lance_external_lib ./...
